general {
    lock_cmd = python3 "$HOME/.config/moi-desktop/desktop.py" lock
    before_sleep_cmd = python3 "$HOME/.config/moi-desktop/desktop.py" lock
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
}

listener {
    timeout = 300
    on-timeout = python3 "$HOME/.config/moi-desktop/desktop.py" lock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="disable"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="enable"})'
}
