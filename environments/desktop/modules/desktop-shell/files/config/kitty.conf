include ../moi-desktop/generated/kitty.conf
font_family UDEV Gothic 35NF
font_size 12
confirm_os_window_close -1
scrollback_lines 20000
map ctrl+shift+y copy_to_clipboard
map ctrl+shift+p paste_from_clipboard
map ctrl+shift+o kitten hints --type url
map ctrl+shift+l kitten hints --type path --program @
