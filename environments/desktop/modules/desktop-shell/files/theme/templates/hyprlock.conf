general {
    hide_cursor = true
}
background {
    monitor =
    color = rgb({{background_hex}})
}
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    rounding = 0
    outer_color = rgb({{border_hex}})
    inner_color = rgb({{surface_hex}})
    font_family = IBM Plex Sans
    font_color = rgb({{foreground_hex}})
    check_color = rgb({{accent_hex}})
    fail_color = rgb({{error_hex}})
    fade_on_empty = false
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
}
