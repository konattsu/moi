#:schema ../../../../schemas/module.schema.json
name = "desktop-shell"
depends_on = ["udev-gothic"]
note = ["Waybar/swaync/fcitx5/hypridleの重複起動を外す。適用時は実行中のUIサービスだけを再起動する。詳細はdesktop-shell/README.md。"]

[packages]
pacman = [
    "hyprland", "uwsm", "kitty", "waybar", "gtk3", "gtk-layer-shell", "python", "python-gobject",
    "python-cairo", "wl-clipboard", "cliphist", "wireplumber", "brightnessctl",
    "networkmanager", "blueman", "pavucontrol", "xdg-utils", "fcitx5", "fcitx5-mozc",
    "fcitx5-gtk", "fcitx5-qt", "hyprlock", "hypridle", "hyprpolkitagent", "swaybg", "librsvg", "grim", "ttf-ibm-plex"
]

[[operations]]
kind = "file"
when = { distro = ["arch"] }
src = "files/backend.py"
dst = "~/.config/moi-desktop/backend.py"

