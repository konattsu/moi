#:schema ../../../../schemas/module.schema.json
name = "zen"


[packages]
pacman = ["desktop-file-utils"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "archive"
when = { distro = ["arch"], arch = ["x86_64"] }
dst = "~/.local/share/moi/apps/zen"
policy = "preserve"
version = "1.24b"
required_paths = ["zen", "updater", "browser/chrome/icons/default/default128.png"]
url = "https://github.com/zen-browser/desktop/releases/download/1.24b/zen.linux-x86_64.tar.xz"
sha256 = "323f2682e73e38247a51fbcc75e5628ed2bb9b404db00cf9cf16af329a916fae"
format = "tar.xz"
root = "zen"

[[operations]]
kind = "archive"
when = { distro = ["arch"], arch = ["aarch64"] }
dst = "~/.local/share/moi/apps/zen"
policy = "preserve"
version = "1.24b"
required_paths = ["zen", "updater", "browser/chrome/icons/default/default128.png"]
url = "https://github.com/zen-browser/desktop/releases/download/1.24b/zen.linux-aarch64.tar.xz"
sha256 = "ec2ff40a809d698d190e58a32b6273b564c1af9c24db1b2442327eab7dcd6f66"
format = "tar.xz"
root = "zen"

[[operations]]
kind = "symlink"
when = { distro = ["arch"] }
target = "~/.local/share/moi/apps/zen/zen"
dst = "~/.local/bin/zen"

[[operations]]
kind = "shell"
when = { distro = ["arch"] }
check = "bash files/desktop-entry.sh check"
run = "bash files/desktop-entry.sh apply"
