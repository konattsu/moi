#:schema ../../../../schemas/module.schema.json
name = "lazygit"
depends_on = ["core"]


[packages]
apt = ["git-delta"]
pacman = ["git-delta"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "archive"
when = { arch = ["x86_64"] }
dst = "~/.local/bin"
policy = "pinned"
version = "0.66.2"
url = "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_x86_64.tar.gz"
sha256 = "158efc9ddfa1241fab5fb3526bb442c8dc6c4b1904d73213b9e4e93e03c52034"
format = "tar.gz"
root = "."
include = ["lazygit"]

[[operations]]
kind = "archive"
when = { arch = ["aarch64"] }
dst = "~/.local/bin"
policy = "pinned"
version = "0.66.2"
url = "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_arm64.tar.gz"
sha256 = "79a3161eeb642f0473e23db6341f7baabd4a5933e921a9c1167c5d5c765c41a4"
format = "tar.gz"
root = "."
include = ["lazygit"]

[[operations]]
kind = "directory"
path = "~/.config/lazygit"
mode = "755"

[[operations]]
kind = "file"
src = "files/config.yml"
dst = "~/.config/lazygit/config.yml"
mode = "644"
