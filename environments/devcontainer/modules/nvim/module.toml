[[commands]]
run = """
mkdir -p "$HOME/.local/bin" "$HOME/.local/share"
NVIM_VERSION=0.12.4
tmpdir="$(mktemp -d)"
trap 'rm -rf "$tmpdir"' EXIT
archive="$tmpdir/nvim-linux-x86_64.tar.gz"
extract_dir="$tmpdir/extract"
curl -fL "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" -o "$archive"
mkdir -p "$extract_dir"
tar -xzf "$archive" -C "$extract_dir"
nvim_bin=""
for candidate in "$extract_dir"/*/bin/nvim; do
  if [ -x "$candidate" ]; then
    nvim_bin="$candidate"
    break
  fi
done
if [ -z "$nvim_bin" ]; then
  echo "nvim binary not found in archive" >&2
  exit 1
fi
nvim_root="$(dirname "$(dirname "$nvim_bin")")"
rm -rf "$HOME/.local/share/nvim-linux-x86_64"
mv "$nvim_root" "$HOME/.local/share/nvim-linux-x86_64"
ln -sf "$HOME/.local/share/nvim-linux-x86_64/bin/nvim" "$HOME/.local/bin/nvim"
"""
unless = """
test -x "$HOME/.local/bin/nvim" &&
"$HOME/.local/bin/nvim" --version >/dev/null 2>&1 &&
"$HOME/.local/bin/nvim" --version | grep -Eq '^NVIM v0\\.12\\.4($|[^0-9])'
"""
requires = ["curl", "dirname", "grep", "ln", "mkdir", "mktemp", "mv", "rm", "tar"]

[[commands]]
platform = "debian"
run = """
mkdir -p "$HOME/.local/bin"
ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
"""
unless = "command -v fd"
requires = ["fdfind"]

[[commands]]
run = """
mkdir -p "$HOME/.local/bin"
tmpdir="$(mktemp -d)"
trap 'rm -rf "$tmpdir"' EXIT
archive="$tmpdir/win32yank.zip"
curl -fL https://github.com/equalsraf/win32yank/releases/latest/download/win32yank-x64.zip -o "$archive"
unzip -q "$archive" -d "$tmpdir/win32yank"
install -m 755 "$tmpdir/win32yank/win32yank.exe" "$HOME/.local/bin/win32yank.exe"
"""
unless = """
if grep -qi microsoft /proc/version 2>/dev/null; then
  command -v win32yank.exe
else
  exit 0
fi
"""
requires = ["curl", "grep", "install", "mkdir", "mktemp", "unzip"]


[env]
path_prepend = ["~/.local/bin"]
