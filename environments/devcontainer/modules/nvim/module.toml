#:schema ../../../../schemas/module.schema.json
name = "nvim"
depends_on = ["core", "node", "fd", "win32yank"]


[packages]
apt = ["lua5.1", "luarocks", "ripgrep", "unzip", "wl-clipboard", "xclip"]
pacman = ["lua51", "luarocks", "ripgrep", "unzip", "wl-clipboard", "xclip"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "archive"
when = { arch = ["x86_64"] }
dst = "~/.local/share/moi/apps/nvim"
policy = "pinned"
version = "0.12.4"
url = "https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz"
sha256 = "012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628"
format = "tar.gz"
root = "nvim-linux-x86_64"

[[operations]]
kind = "archive"
when = { arch = ["aarch64"] }
dst = "~/.local/share/moi/apps/nvim"
policy = "pinned"
version = "0.12.4"
url = "https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-arm64.tar.gz"
sha256 = "ceb7e88c6b681f0515d135dcdfad54f5eb4373b25ce6172197cd9a69c758063f"
format = "tar.gz"
root = "nvim-linux-arm64"

[[operations]]
kind = "symlink"
target = "~/.local/share/moi/apps/nvim/bin/nvim"
dst = "~/.local/bin/nvim"

[[operations]]
kind = "directory"
path = "~/.config/nvim"
mode = "755"

[[operations]]
kind = "directory"
path = "~/.config/nvim/colors"
mode = "755"

[[operations]]
kind = "directory"
path = "~/.config/nvim/after/queries/rust"
mode = "755"

[[operations]]
kind = "directory"
path = "~/.config/nvim/lua/colors/solarized_dark"
mode = "755"

[[operations]]
kind = "file"
src = "files/after/queries/rust/highlights.scm"
dst = "~/.config/nvim/after/queries/rust/highlights.scm"
mode = "644"

[[operations]]
