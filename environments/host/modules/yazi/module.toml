#:schema ../../../../schemas/module.schema.json
name = "yazi"
depends_on = ["core", "fd", "lazygit"]


[packages]
apt = ["fzf", "hexyl", "imagemagick", "jq", "p7zip-full", "poppler-utils", "ripgrep", "wl-clipboard", "xclip", "zoxide"]
pacman = ["fzf", "hexyl", "imagemagick", "jq", "p7zip", "poppler", "ripgrep", "wl-clipboard", "xclip", "zoxide"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "archive"
when = { arch = ["x86_64"] }
dst = "~/.local/bin"
policy = "pinned"
version = "26.9.1"
url = "https://github.com/sxyazi/yazi/releases/download/v26.9.1/yazi-x86_64-unknown-linux-gnu.zip"
sha256 = "a02fe91d3304294048c681f010f1100856872a4e98ecf6927328e888d40a6ad2"
format = "zip"
root = "yazi-x86_64-unknown-linux-gnu"
include = ["yazi", "ya"]

[[operations]]
kind = "archive"
when = { arch = ["aarch64"] }
dst = "~/.local/bin"
policy = "pinned"
version = "26.9.1"
url = "https://github.com/sxyazi/yazi/releases/download/v26.9.1/yazi-aarch64-unknown-linux-gnu.zip"
sha256 = "02807f08d6b589b65b7516a4e259d83f5995d7a23bb12b3a155141385b370b3a"
format = "zip"
root = "yazi-aarch64-unknown-linux-gnu"
include = ["yazi", "ya"]

[[operations]]
kind = "directory"
path = "~/.config/yazi"
mode = "755"

[[operations]]
kind = "file"
src = "files/init.lua"
dst = "~/.config/yazi/init.lua"
mode = "644"

[[operations]]
kind = "file"
src = "files/keymap.toml"
dst = "~/.config/yazi/keymap.toml"
mode = "644"

[[operations]]
kind = "file"
src = "files/package.toml"
dst = "~/.config/yazi/package.toml"
mode = "644"

[[operations]]
kind = "file"
src = "files/theme.toml"
dst = "~/.config/yazi/theme.toml"
mode = "644"

[[operations]]
kind = "file"
src = "files/yazi.toml"
dst = "~/.config/yazi/yazi.toml"
mode = "644"

[[operations]]
kind = "file"
src = "files/plugins/folder-rules.yazi/main.lua"
dst = "~/.config/yazi/plugins/folder-rules.yazi/main.lua"
mode = "644"

[[operations]]
kind = "file"
src = "files/plugins/hexyl.yazi/main.lua"
dst = "~/.config/yazi/plugins/hexyl.yazi/main.lua"
mode = "644"

[[operations]]
kind = "file"
src = "files/plugins/lazygit.yazi/main.lua"
dst = "~/.config/yazi/plugins/lazygit.yazi/main.lua"
mode = "644"
