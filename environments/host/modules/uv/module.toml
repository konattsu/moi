#:schema ../../../../schemas/module.schema.json
name = "uv"
depends_on = ["core", "zsh", "bash"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "directory"
path = "~/.local/share/bash-completion/completions"
mode = "755"

[[operations]]
kind = "directory"
path = "~/.local/share/zsh/site-functions"
mode = "755"

[[operations]]
kind = "shell"
run = '''
curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
'''
check = "command -v uv"

[[operations]]
kind = "shell"
run = '''
uv generate-shell-completion bash > "$HOME/.local/share/bash-completion/completions/uv"
'''
check = "test -f ~/.local/share/bash-completion/completions/uv"

[[operations]]
kind = "shell"
run = '''
uvx --generate-shell-completion bash > "$HOME/.local/share/bash-completion/completions/uvx"
'''
check = "test -f ~/.local/share/bash-completion/completions/uvx"

[[operations]]
kind = "shell"
run = '''
uv generate-shell-completion zsh > "$HOME/.local/share/zsh/site-functions/_uv"
'''
check = "test -f ~/.local/share/zsh/site-functions/_uv"

[[operations]]
kind = "shell"
run = '''
uvx --generate-shell-completion zsh > "$HOME/.local/share/zsh/site-functions/_uvx"
'''
check = "test -f ~/.local/share/zsh/site-functions/_uvx"
