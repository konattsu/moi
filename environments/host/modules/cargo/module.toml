#:schema ../../../../schemas/module.schema.json
name = "cargo"
depends_on = ["zsh", "bash"]


[env]
path_prepend = ["~/.cargo/bin"]


[[operations]]
kind = "block"
src = "files/cargo.sh"
dst = "~/.zshrc"
marker = "moi:cargo"

[[operations]]
kind = "block"
src = "files/cargo.sh"
dst = "~/.bashrc"
marker = "moi:cargo"

[[operations]]
kind = "shell"
run = '''
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
'''
check = "test -x \"$HOME/.cargo/bin/cargo\""
