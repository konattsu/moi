#:schema ../../../../schemas/module.schema.json
name = "zsh"
depends_on = ["core"]
note = ["Run `chsh -s /bin/zsh` to set zsh as your default shell."]


[packages]
apt = ["fontconfig", "unzip", "vim", "zsh"]
pacman = ["fontconfig", "unzip", "vim", "zsh"]


[env]
path_prepend = ["~/.local/bin"]


[[operations]]
kind = "file"
src = "files/my_theme.omp.json"
dst = "~/.poshthemes/my_theme.omp.json"

[[operations]]
kind = "block"
src = "files/zshrc.sh"
dst = "~/.zshrc"
marker = "moi:zsh"

[[operations]]
kind = "block"
src = "files/editor.sh"
dst = "~/.zshrc"
marker = "moi:zsh:editor"

[[operations]]
kind = "shell"
run = '''
RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
'''
check = "test -d \"$HOME/.oh-my-zsh\""

[[operations]]
kind = "shell"
run = '''
mkdir -p "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins"
git clone https://github.com/zsh-users/zsh-autosuggestions "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"
'''
check = "test -d \"${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions\""

[[operations]]
kind = "shell"
run = '''
mkdir -p "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins"
git clone https://github.com/zsh-users/zsh-syntax-highlighting.git "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"
'''
check = "test -d \"${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting\""

[[operations]]
kind = "shell"
run = '''
curl -fsSL https://ohmyposh.dev/install.sh | bash -s
'''
check = "command -v oh-my-posh"
