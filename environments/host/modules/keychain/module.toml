#:schema ../../../../schemas/module.schema.json
name = "keychain"
depends_on = ["zsh", "bash"]
note = ["Add SSH keys to keychain manually as needed."]


[packages]
apt = ["keychain"]
pacman = ["keychain"]


[[operations]]
kind = "directory"
path = "~/.config/moi"
mode = "755"

[[operations]]
kind = "block"
src = "files/keychain.sh"
dst = "~/.zshrc"
marker = "moi:keychain"

[[operations]]
kind = "block"
src = "files/keychain.sh"
dst = "~/.bashrc"
marker = "moi:keychain"
