#:schema ../../../../schemas/module.schema.json
name = "git"
note = ["Remember to set the ssh key for signing commits."]


[packages]
apt = ["git", "vim"]
pacman = ["git", "vim"]


[[operations]]
kind = "directory"
path = "~/.ssh"
mode = "700"

[[operations]]
kind = "directory"
path = "~/.config/moi/git"
mode = "755"

[[operations]]
kind = "file"
src = "files/config"
dst = "~/.config/moi/git/config"
mode = "644"

[[operations]]
kind = "shell"
run = '''
git config --global --add include.path "$HOME/.config/moi/git/config"
'''
check = '''
if includes="$(git config --global --get-all include.path)"; then
  printf '%s\n' "$includes" | grep -Fxq "$HOME/.config/moi/git/config"
else
  status=$?
  case "$status" in
    1) exit 1 ;;
    *) exit 2 ;;
  esac
fi
'''
