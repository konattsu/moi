#:schema ../../../../schemas/module.schema.json
name = "docker"
depends_on = ["core"]
note = ["Run `sudo usermod -aG docker $USER` to add your user to the docker group."]


[packages]
pacman = ["docker"]


[[operations]]
kind = "shell"
when = { distro = ["debian"] }
run = '''
curl -fsSL https://get.docker.com | sudo bash
'''
check = "command -v docker"
