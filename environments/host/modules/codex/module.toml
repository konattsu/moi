#:schema ../../../../schemas/module.schema.json
name = "codex"
depends_on = ["node"]


[packages]
apt = ["bubblewrap"]
pacman = ["bubblewrap"]


[[operations]]
kind = "directory"
path = "~/.codex/rules"
mode = "700"

[[operations]]
kind = "file"
src = "files/rules/moi.rules"
dst = "~/.codex/rules/moi.rules"
mode = "600"

[[operations]]
kind = "shell"
run = "npm install -g @openai/codex"
check = "command -v codex"
